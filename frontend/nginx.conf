server {
    listen       ${NGINX_PORT};
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Plotly alone is ~4.8 MB of JS; compressing it is the difference
    # between a 5 MB and a 1.5 MB first load.
    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_types       text/plain text/css application/javascript
                     application/json image/svg+xml;

    # Vite emits content-hashed filenames, so assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths fall back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         ${BACKEND_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A 41x41 pair study across three nanofluids runs for many minutes;
        # the default 60s read timeout would kill it mid-solve.
        proxy_connect_timeout  30s;
        proxy_send_timeout     1800s;
        proxy_read_timeout     1800s;
        proxy_buffering        off;
    }

    location = /health {
        proxy_pass       ${BACKEND_ORIGIN}/health;
        proxy_set_header Host $host;
    }
}
